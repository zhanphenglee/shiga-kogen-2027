title: "Shiga Kogen 2027"
tagline: "Our ski trip to Shiga Kogen, Nagano — 2027 season"
description: >-
  Trip planning site for our Shiga Kogen ski trip, 2027 season.
  Itinerary, accommodation, packing list, budget, and everyone's info in one place.

# Update these once dates/flights are locked in
trip:
  destination: "Shiga Kogen, Nagano, Japan"
  season: "2027"
  start_date: "TBD"
  end_date: "TBD"
  pax: 12

# GitHub Pages will fill this in automatically when built via Actions,
# but set it explicitly so local builds and links work too.
url: "https://zhanphenglee.github.io"
baseurl: "/shiga-kogen-2027"

theme: minima
minima:
  skin: auto

nav:
  - title: Home
    url: /
  - title: Packing List
    url: /packing-list/
  - title: Budget
    url: /budget/
  - title: Who's Coming
    url: /participants/
  - title: Resources
    url: /resources/

plugins:
  - jekyll-feed
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - node_modules
